<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apuntes de detective · Agencia La Lupa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Special+Elite&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  /* Apuntes imprimibles (A4): una hoja por regla con los esquemas de la Academia y huecos para completar.
     Datos: ../datos/academia/apuntes.json + ../datos/reglas.json. ?reglas=b-v-1,h-1 · ?reglas=todas (por defecto). */
  :root { --tinta: #1d1a16; --gris: #6b645a; --linea: #b9b1a3; --acento: #a8322d; }
  * { box-sizing: border-box; }
  html { background: #8a8378; }
  body { margin: 0; font: 13.5px/1.35 "Nunito", sans-serif; color: var(--tinta); }
  .hoja { width: 210mm; height: 297mm; margin: 10mm auto; padding: 13mm 14mm 11mm; background: #fff; overflow: hidden; display: flex; flex-direction: column; gap: 3.5mm; box-shadow: 0 4px 18px rgba(0,0,0,.35); }
  .cab { display: flex; align-items: flex-end; gap: 4mm; border-bottom: 2.5px solid var(--tinta); padding-bottom: 2.5mm; }
  .cab .agencia { font: 12px "Special Elite", monospace; letter-spacing: .12em; color: var(--gris); }
  .cab h1 { margin: 0; font: 30px/1.02 "Bebas Neue", sans-serif; letter-spacing: .04em; }
  .cab .exp { margin-left: auto; font: 14px "Special Elite"; border: 1.5px solid var(--tinta); padding: 1.5mm 3mm; white-space: nowrap; }
  .intro { margin: 0; font: 14px/1.4 "Special Elite", monospace; border-left: 3px solid var(--acento); padding: .5mm 0 .5mm 3mm; }
  .intro b { font: 800 12px "Nunito"; letter-spacing: .08em; color: var(--acento); margin-right: 1.5mm; }
  h2 { margin: 0 0 1.2mm; font: 20px "Bebas Neue", sans-serif; letter-spacing: .05em; }
  h2 .n { display: inline-block; min-width: 6mm; height: 6mm; margin-right: 2mm; border: 1.5px solid var(--tinta); border-radius: 50%; text-align: center; font: 14px/5.6mm "Bebas Neue"; vertical-align: 1px; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; table-layout: auto; }
  th, td { border: 1.2px solid var(--tinta); padding: 1.4mm 2mm; text-align: left; vertical-align: top; }
  th { font: 800 11.5px "Nunito"; letter-spacing: .03em; text-transform: uppercase; border-bottom-width: 2px; }
  td:first-child { font-weight: 800; }
  td.hueco { min-width: 32mm; height: 10mm; }
  td.hueco::after { content: ""; display: block; height: 6mm; border-bottom: 1px dotted var(--gris); }
  th.mio { min-width: 32mm; }
  .tabla.ancha td.hueco { min-width: 16mm; }
  .tabla.ancha th.mio { min-width: 16mm; }
  ul.trucos, ol.pasos { margin: 0; padding-left: 5mm; display: grid; gap: .8mm; }
  ul.trucos li::marker { content: "▸ "; }
  ol.pasos { list-style: none; padding-left: 0; }
  ol.pasos li { display: grid; grid-template-columns: 8mm 1fr; }
  ol.pasos li b { font: 18px/1.1 "Bebas Neue"; }
  .completar { border: 1.5px dashed var(--tinta); border-radius: 2mm; padding: 2mm 3.5mm; font-size: 12.5px; }
  .completar b { font: 16px "Bebas Neue"; letter-spacing: .05em; margin-right: 1.5mm; }
  .mios { flex: 1; min-height: 30mm; border: 1.5px solid var(--tinta); border-radius: 2mm; padding: 2mm 3.5mm 0; overflow: hidden; display: flex; flex-direction: column; }
  .mios h2 { margin: 0; }
  .mios .lineas { flex: 1; overflow: hidden; }
  .mios .lineas i { display: block; height: 7.6mm; border-bottom: 1px solid var(--linea); }
  .nw { white-space: nowrap; }
  .pie { display: flex; justify-content: space-between; font: 11px "Special Elite"; color: var(--gris); }
  .aviso { max-width: 210mm; margin: 10mm auto; background: #fff7d6; border: 1px solid #c9b26a; border-radius: 8px; padding: 10px 14px; font-size: 14px; }
  .controles { position: fixed; left: 12px; bottom: 12px; max-width: 380px; background: #fff7d6; border: 1px solid #c9b26a; border-radius: 8px; padding: 10px 14px; font-size: 13px; box-shadow: 0 2px 10px rgba(0,0,0,.25); }
  .controles button { margin-top: 6px; font: 800 14px "Nunito"; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--tinta); background: #fff; cursor: pointer; }
  @page { size: A4; margin: 0; }
  @media print { html { background: none; } .hoja { margin: 0; box-shadow: none; break-after: page; } .controles, .aviso { display: none; } }
  @media screen and (max-width: 820px) { .hoja { zoom: .45; margin: 4mm; } }
</style>
</head>
<body>
<div id="apuntes"><p class="aviso">Preparando los apuntes…</p></div>
<aside class="controles">
  <b>Apuntes de detective.</b> Una hoja por regla: el alumno copia los esquemas en su libreta y los completa con sus ejemplos. Elige las reglas con <code>?reglas=b-v-1,h-1</code> o <code>?reglas=todas</code>.<br>
  <button onclick="print()">Imprimir</button>
</aside>
<script>
"use strict";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// Texto de los esquemas: las palabras con guion (-n, ca-MIÓN, MÚ-si-ca) no se parten al final de la línea.
const txt = s => esc(s).replace(/\S*-\S*/g, m => `<span class="nw">${m}</span>`);
const leer = async ruta => { const r = await fetch(ruta); if (!r.ok) throw new Error(ruta); return r.json(); };
const MIO = /^mis? (ejemplos?|frase)/i;

function tabla(e) {
  const mias = e.columnas.map(c => MIO.test(c));
  const ancha = e.columnas.length >= 6 ? " ancha" : "";
  const cab = e.columnas.map((c, i) => `<th${mias[i] ? ' class="mio"' : ""}>${esc(c)}</th>`).join("");
  const filas = e.filas.map(f => `<tr>${f.map(c => c === "" ? '<td class="hueco"></td>' : `<td>${txt(c)}</td>`).join("")}</tr>`).join("");
  return `<table class="tabla${ancha}"><thead><tr>${cab}</tr></thead><tbody>${filas}</tbody></table>`;
}
const lista = e => `<ul class="trucos">${e.puntos.map(p => `<li>${txt(p)}</li>`).join("")}</ul>`;
function pasos(e) {
  return `<ol class="pasos">${e.pasos.map(p => {
    const m = p.match(/^(\d+\.º)\s+(.*)$/);
    return m ? `<li><b>${esc(m[1])}</b><span>${txt(m[2])}</span></li>` : `<li><b></b><span>${txt(p)}</span></li>`;
  }).join("")}</ol>`;
}
const PINTAR = { tabla, lista, pasos };

function hoja(id, a, regla, n, total) {
  const esquemas = a.esquemas.map((e, i) => `<section><h2><span class="n">${i + 1}</span>${esc(e.titulo)}</h2>${(PINTAR[e.tipo] || (() => ""))(e)}</section>`).join("");
  return `<section class="hoja" data-regla="${esc(id)}">
    <header class="cab"><div><div class="agencia">AGENCIA LA LUPA · APUNTES DE DETECTIVE</div><h1>${esc(regla?.nombre || a.titulo)}</h1></div><div class="exp">Regla ${n}/${total}</div></header>
    <p class="intro"><b>MATEO</b>${esc(a.intro)}</p>
    ${esquemas}
    <div class="completar"><b>Para completar</b>${txt(a.completar)}</div>
    <div class="mios"><h2>Mis ejemplos</h2><div class="lineas">${"<i></i>".repeat(24)}</div></div>
    <footer class="pie"><span>Cópialo en tu libreta y repásalo antes del caso.</span><span>Nombre: ______________________</span></footer>
  </section>`;
}

(async () => {
  const q = new URLSearchParams(location.search);
  const caja = document.querySelector("#apuntes");
  try {
    const [apuntes, reglas] = await Promise.all([leer("../datos/academia/apuntes.json"), leer("../datos/reglas.json")]);
    const todas = Object.keys(apuntes);
    const pedido = (q.get("reglas") || "todas").trim();
    const ids = pedido === "todas" ? todas : pedido.split(",").map(s => s.trim()).filter(Boolean);
    const validos = ids.filter(id => apuntes[id]);
    const desconocidos = ids.filter(id => !apuntes[id]);
    const aviso = desconocidos.length ? `<p class="aviso">Sin apuntes para: ${esc(desconocidos.join(", "))}.</p>` : "";
    caja.innerHTML = aviso + (validos.length
      ? validos.map(id => hoja(id, apuntes[id], reglas[id], todas.indexOf(id) + 1, todas.length)).join("")
      : `<p class="aviso">No hay ninguna regla que imprimir. Prueba con <code>?reglas=todas</code>.</p>`);
  } catch (e) {
    caja.innerHTML = `<p class="aviso">No se han podido cargar los apuntes (${esc(e.message)}). Ábrelos desde el juego o desde un servidor web.</p>`;
  }
})();
</script>
</body>
</html>
